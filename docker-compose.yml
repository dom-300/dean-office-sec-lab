services:
  api:
    build: .
    container_name: dean_office_modern
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./app:/app_code/app
      - ./alembic:/app_code/alembic
      - ./alembic.ini:/app_code/alembic.ini
      - db_data:/app_code/data
    env_file:
      - .env
    restart: unless-stopped

volumes:
  db_data:
